{% extends "layout.html" %}
{% block title %}Logout - WealthPoint{% endblock %}

{% block content %}
<div class="logout-container fade-in-1">
    <div class="logout-card fade-in-2" data-tilt>
        <div class="logout-icon fade-in-3">
            <i class="fas fa-sign-out-alt"></i>
        </div>
        <h2 class="fade-in-4">Ready to Leave?</h2>
        <p class="fade-in-5">Are you sure you want to log out of your WealthPoint account?</p>
        
        <div class="logout-actions fade-in-6">
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="btn-logout">
                    <i class="fas fa-sign-out-alt"></i> Yes, Log Out
                </button>
            </form>
            <a href="{% url 'landing' %}" class="btn-cancel">
                <i class="fas fa-arrow-left"></i> No, Go Back
            </a>
        </div>
    </div>
</div>


{% endblock %}
