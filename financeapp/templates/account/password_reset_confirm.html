{% extends "layout.html" %}
{% block content %}
<div class="page-wrap-sm">
  <div class="card fade-in-1" data-tilt>
    <h2 class="mb-2">Enter New Password</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary mt-1">Reset Password</button>
    </form>
  </div>
</div>
{% endblock %}
